name: Validate LuxenOS release tree

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep (used by tools/validate-release-tree)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run tools/validate-release-tree
        run: ./tools/validate-release-tree

  package-lists-resolve:
    # Catch a package name that does not exist in trixie in about a minute,
    # instead of 30-90 minutes into a full `lb build`. apt reports every
    # unresolvable name in one pass, so this finds them all at once.
    runs-on: ubuntu-latest
    needs: validate-tree
    container: debian:trixie
    steps:
      - name: Enable the archive areas auto/config builds with
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          areas='main contrib non-free non-free-firmware'
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i "s/^Components:.*/Components: $areas/" \
              /etc/apt/sources.list.d/debian.sources
          else
            sed -i "s/ main\$/ $areas/" /etc/apt/sources.list
          fi
          apt-get update

      - uses: actions/checkout@v4

      - name: Every package in config/package-lists must exist in trixie
        run: |
          set -eu
          packages=$(cat config/package-lists/*.list.chroot \
            | sed 's/#.*//' | tr -s '[:space:]' '\n' | grep -v '^$' | sort -u)
          echo "checking $(echo "$packages" | wc -l) package names"
          # Unquoted on purpose: apt takes the names as separate arguments.
          if apt-get install -s --no-install-recommends $packages >/tmp/apt.out 2>&1; then
            echo "all package names resolve"
          else
            echo "apt could not resolve the package lists:"
            grep -E '^E:' /tmp/apt.out || tail -30 /tmp/apt.out
            exit 1
          fi

  lb-config-dry-run:
    # auto/config uses live-build 5 option names (Debian 13). ubuntu-latest
    # ships an older live-build that rejects them, so run in a Debian 13
    # container instead.
    runs-on: ubuntu-latest
    needs: validate-tree
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        variant: [installer, live]
    steps:
      - name: Install live-build (Debian 13) and git
        run: apt-get update && apt-get install -y --no-install-recommends live-build git ca-certificates

      - uses: actions/checkout@v4

      - name: lb config (no build)
        env:
          VARIANT: ${{ matrix.variant }}
        run: lb config
        # A full `lb build` + QEMU boot smoke test is a longer-running job
        # tracked as a follow-up; this only proves the config step itself
        # is well-formed.

      - name: Boot parameters must match the variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eu
          append=$(grep -rh '^LB_BOOTAPPEND_LIVE=' config/) \
            || { echo "no LB_BOOTAPPEND_LIVE in the generated config"; exit 1; }
          echo "$VARIANT: $append"
          case "$VARIANT" in
            live)
              case "$append" in
                *luxenos.session=desktop*) ;;
                *) echo "live image does not boot the desktop session"; exit 1 ;;
              esac
              ;;
            installer)
              case "$append" in
                *luxenos.session=desktop*)
                  echo "installer image must not preset the desktop session"; exit 1 ;;
              esac
              ;;
          esac
