name: Draft LuxenOS release

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which image to release'
        type: choice
        options: [installer, live, traditional]
        default: installer
        required: true
      run_id:
        description: 'Build run ID to take the image from (empty = newest build of this variant)'
        type: string
        required: false
      tag:
        description: 'Release tag (empty = luxenos-<variant>-<build run ID>)'
        type: string
        required: false

permissions:
  contents: write
  actions: read

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      # RELEASE_PAT if configured; otherwise the job token (contents: write
      # and actions: read above are enough for artifacts and releases).
      GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
      GH_REPO: ${{ github.repository }}
      VARIANT: ${{ inputs.variant }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Find the build run and its artifact
        id: find
        shell: bash
        run: |
          set -euo pipefail

          artifact="luxenos-$VARIANT-iso"
          if [ -n "${RUN_ID}" ]; then
            query="repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?name=$artifact"
          else
            query="repos/$GH_REPO/actions/artifacts?name=$artifact&per_page=100"
          fi

          found=$(gh api "$query" --jq '
            [.artifacts[] | select(.expired == false)][0]
            | select(. != null)
            | "\(.workflow_run.id) \(.workflow_run.head_sha)"
          ')

          if [ -z "$found" ]; then
            echo "::error::No unexpired $artifact artifact found${RUN_ID:+ in run $RUN_ID}"
            exit 1
          fi

          run_id=${found% *}
          sha=${found#* }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-luxenos-$VARIANT-$run_id}" >> "$GITHUB_OUTPUT"

      - name: Download and extract the image artifact
        env:
          ARTIFACT: ${{ steps.find.outputs.artifact }}
          BUILD_RUN: ${{ steps.find.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$BUILD_RUN" -n "$ARTIFACT" -D dist
          ls -lah dist

      - name: Validate image artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          name="luxenos-$VARIANT-amd64.iso"

          if [ ! -f "$name.sha256" ]; then
            echo "::error::Missing $name.sha256"
            exit 1
          fi

          if [ -f "$name" ]; then
            # Whole image (within the 2 GiB asset cap): release it as is.
            sha256sum -c "$name.sha256"
          elif compgen -G "$name.part[0-9][0-9]" >/dev/null; then
            # Split image: check every part, then that they rebuild the
            # original image the build recorded.
            sha256sum -c SHA256SUMS.parts
            want=$(cut -d' ' -f1 "$name.sha256")
            got=$(cat "$name".part[0-9][0-9] | sha256sum | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error::The parts do not reassemble into $name"
              exit 1
            fi
            if [ ! -f REASSEMBLE.md ]; then
              echo "::error::REASSEMBLE.md is missing for a split image"
              exit 1
            fi
          else
            echo "::error::Neither $name nor its parts are in the artifact"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.find.outputs.sha }}
          path: src
          sparse-checkout: config/includes.chroot/etc/calamares/modules/welcome.conf
          sparse-checkout-cone-mode: false

      - name: Draft the release
        env:
          BUILD_RUN: ${{ steps.find.outputs.run_id }}
          SHA: ${{ steps.find.outputs.sha }}
          RELEASE_TAG: ${{ steps.find.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          name="luxenos-$VARIANT-amd64.iso"

          if [ -f "dist/REASSEMBLE.md" ]; then
            cp dist/REASSEMBLE.md notes.md
          else
            printf '%s\n' "# LuxenOS $VARIANT image" > notes.md
          fi

          size=0
          if compgen -G "dist/$name.part*" > /dev/null; then
            size=$(cat dist/"$name".part* | wc -c)
          elif [ -f "dist/$name" ]; then
            size=$(wc -c < "dist/$name")
          fi

          welcome=src/config/includes.chroot/etc/calamares/modules/welcome.conf
          storage=""
          ram=""
          if [ -f "$welcome" ]; then
            storage=$(awk '$1 == "requiredStorage:" {print $2}' "$welcome")
            ram=$(awk '$1 == "requiredRam:" {print $2}' "$welcome")
          fi

          image_mib=$(( (size + 1048575) / 1048576 ))
          usb=4
          while [ $(( usb * 1000000000 )) -lt "$size" ]; do usb=$(( usb * 2 )); done

          {
            echo
            echo "## Requirements"
            echo
            echo "- Image size: $image_mib MiB; a USB stick of $usb GB or larger"
            echo "- Install disk: ${storage:-unknown} GiB or more"
            echo "- RAM: ${ram:-unknown} GiB or more"
            echo
            echo "Built by $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$BUILD_RUN"
            echo "from commit $SHA."
          } >> notes.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --draft \
            --target "$SHA" \
            --title "LuxenOS $VARIANT ($RELEASE_TAG)" \
            --notes-file notes.md
