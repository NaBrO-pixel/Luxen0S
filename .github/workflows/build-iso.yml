name: Build LuxenOS ISO

# Manual only: a full `lb build` takes 30-90 minutes, so it does not run on
# every push. Actions tab -> "Build LuxenOS ISO" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which image to build'
        type: choice
        options: [installer, live]
        default: installer
        required: true

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # A GitHub runner ships ~10-20 GB of toolchains LuxenOS does not need,
      # and the build wants every gigabyte it can get.
      - name: Free disk space on the runner
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          echo "after:"; df -h / | tail -1

      # live-build runs in a Debian 13 container (auto/config needs live-build 5,
      # which ubuntu-latest does not have) and needs --privileged for the
      # mount/chroot/loop operations a live image build performs.
      - name: Build the ISO
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          docker run --rm --privileged \
            -v "$PWD":/build -w /build \
            -e VARIANT="$VARIANT" \
            debian:trixie sh -c '
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends live-build curl ca-certificates
              lb config
              lb build
            '

      # What is actually taking up the space, so shrinking the image is driven
      # by numbers instead of guesswork. Best-effort: a report must never fail
      # a build that otherwise produced an ISO.
      - name: Report image size breakdown
        continue-on-error: true
        run: |
          set -u
          echo "=== ISO and squashfs ==="
          ls -l ./*.hybrid.iso 2>/dev/null || true
          sudo find binary -name filesystem.squashfs -exec ls -l {} + 2>/dev/null || true
          echo
          echo "=== chroot total (uncompressed) ==="
          sudo du -sh chroot 2>/dev/null || true
          echo
          echo "=== 40 largest packages, installed-size KB ==="
          sudo dpkg-query --admindir=chroot/var/lib/dpkg -W \
            -f='${Installed-Size}\t${Package}\n' 2>/dev/null \
            | sort -rn | head -40 || true
          echo
          echo "=== largest directories in the chroot ==="
          sudo du -xh --max-depth=2 chroot 2>/dev/null | sort -rh | head -25 || true

      - name: Name the image, and split it if it exceeds the release cap
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -eu
          iso=$(ls ./*.hybrid.iso 2>/dev/null | head -1)
          if [ -z "$iso" ]; then
            echo "no ISO was produced"
            exit 1
          fi
          name="luxenos-$VARIANT-amd64.iso"
          sudo mv "$iso" "$name"
          sudo chown "$(id -u):$(id -g)" "$name"
          sha256sum "$name" | tee "$name.sha256"
          ls -lh "$name"

          # A single GitHub release asset is capped at 2 GiB. Ship the image in
          # parts when it does not fit, and as one file when it does, so this
          # stops splitting by itself once the image is small enough.
          limit=2147483648
          size=$(stat -c%s "$name")
          if [ "$size" -le "$limit" ]; then
            echo "$name is $size bytes, within the 2 GiB release cap: not splitting"
            exit 0
          fi

          echo "$name is $size bytes, over the 2 GiB release cap: splitting"
          split -b 1900M -d "$name" "$name.part"
          # Deliberately NOT "$name.parts.sha256": that name is matched by the
          # "$name.part*" glob used to reassemble, and cat would append the
          # checksum file into the image.
          sha256sum "$name".part[0-9][0-9] | tee SHA256SUMS.parts
          # Keeping the whole image as well would double the artifact for no
          # gain: the parts plus the recorded digest rebuild and verify it.
          rm -f "$name"
          ls -lh "$name".part[0-9][0-9]

          printf '%s\n' \
            "# LuxenOS $VARIANT image (split)" \
            "" \
            "A single GitHub release asset is capped at 2 GiB and this image is" \
            "larger, so it ships in parts." \
            "" \
            "Reassemble:" \
            "" \
            "    cat $name.part[0-9][0-9] > $name" \
            "" \
            "Verify the reassembled image against the digest of the original:" \
            "" \
            "    sha256sum -c $name.sha256" \
            "" \
            "To check the downloads before reassembling:" \
            "" \
            "    sha256sum -c SHA256SUMS.parts" \
            > REASSEMBLE.md

      - uses: actions/upload-artifact@v4
        with:
          name: luxenos-${{ inputs.variant }}-iso
          path: |
            luxenos-*-amd64.iso
            luxenos-*-amd64.iso.part[0-9][0-9]
            luxenos-*-amd64.iso.sha256
            SHA256SUMS.parts
            REASSEMBLE.md
          retention-days: 7
          # The ISO is already compressed; re-compressing it just burns time.
          compression-level: 0
          if-no-files-found: error
