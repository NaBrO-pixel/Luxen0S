# LuxenOS Windows-program (Wine) settings. System defaults; per-user overrides
# go in ~/.config/luxenos/wine.conf (same format).
# KEY=VALUE only, no inline comments.

# Wine prefix (the private "C: drive"). Always per-user, never root.
# Empty = ~/.wine
LUXENOS_WINE_PREFIX=

# Ask before running a Windows program? Wine is NOT a sandbox: a Windows
# program can read and change everything your user account can.
# no | yes
LUXENOS_WINE_CONFIRM=no

# If a program exits with an error within this many seconds of starting,
# show an error dialog with the Wine log. 0 disables the dialog.
LUXENOS_WINE_QUICKFAIL_SECS=8
