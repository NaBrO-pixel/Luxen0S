# LuxenOS dock - system defaults.
#
# Per-user settings go in ~/.config/luxenos/dock.conf (same format) and win
# over this file; Settings > Dock and `luxenos-dock config KEY VALUE` write
# that file. The running dock applies changes immediately.
#
# Format: KEY=VALUE, one per line, no shell syntax. Invalid values fall back
# to the defaults shown here.

# yes | no   Show the dock at all.
DOCK_ENABLE=yes
# bottom | left | right   (the top edge belongs to Waybar)
DOCK_POSITION=bottom
# Icon size in px, 24-96.
DOCK_ICON_SIZE=44
# Space between icons in px, 0-24.
DOCK_SPACING=6
# yes | no   Hide until the pointer touches the screen edge. When "no", the
# dock reserves its space and windows are tiled above it.
DOCK_AUTOHIDE=no
# all | first   One dock on every monitor, or only on the first one.
DOCK_MONITORS=all
# Pinned applications, by desktop file id, in order. Apps that are not
# installed are skipped.
DOCK_PINNED=luxenos-files.desktop firefox-esr.desktop foot.desktop luxenos-software.desktop luxenos-settings.desktop
