# LuxenOS "liquid glass" appearance - the single place to tune it.
#
# System defaults live here (/etc/luxenos/glass.conf). Per-user overrides go
# in ~/.config/luxenos/glass.conf (same format) and win over this file. Do not
# edit generated files under ~/.config/luxenos/glass/.
# Apply changes with:   luxenos-glass apply   (Super+C also switches presets)
#
# Format: KEY=VALUE, one per line, no inline comments, no shell syntax. The file
# is parsed, never executed; invalid values fall back to safe defaults and are
# reported by `luxenos-glass apply`.
# Any key left commented out takes its value from GLASS_PRESET.

# --- Master switches -------------------------------------------------------
# yes | no   "no" gives a flat, opaque, fastest theme (no glass at all).
GLASS_ENABLE=yes
# dark | light
GLASS_THEME=dark
# performance | balanced | rich
#   performance  no blur, no shadows, no animation, opaque-ish panels
#   balanced     moderate blur (radius 5, 2 passes), soft shadows, short fades
#   rich         strong blur (radius 8, 3 passes), deep shadows, punchier blur
#                colour, dimmed inactive windows, longer fades
GLASS_PRESET=balanced
# auto | off   auto = use blur/shadows/rounded windows when the RUNNING
# compositor is SwayFX (asked over IPC, not guessed from installed packages).
# Stock Sway has none of these and gets tinted translucency instead.
GLASS_EFFECTS=auto
# yes forces animation speed to 0 (accessibility / older hardware). Hover and
# focus colours still change instantly, so the UI keeps its visual feedback.
GLASS_REDUCE_MOTION=no

# --- Look ------------------------------------------------------------------
# Accent colour, #RRGGBB.
GLASS_ACCENT=#7aa2ff
# UI font family and size in px (bar, launcher, notifications).
GLASS_FONT=Inter
GLASS_FONT_SIZE=13

# --- Readability -----------------------------------------------------------
# Opacity floor used when the compositor cannot blur. Without blur, very
# transparent panels are hard to read, so panels are never below this.
GLASS_FALLBACK_OPACITY=82
# Minimum text contrast ratio (WCAG scale, 1-21). Panel opacity is raised as
# needed so text stays this readable even over the worst-case bright (dark
# theme) or dark (light theme) backdrop. 3.0 = large text/UI, 4.5 = body text.
GLASS_MIN_CONTRAST=3.0

# --- Tunables (defaults come from GLASS_PRESET; uncomment to override) -----
# yes | no   blur behind panels (SwayFX only)
#GLASS_BLUR=yes
# Panel opacity, 0-100 (%). Lower = more see-through.
#GLASS_OPACITY=68
# Thin border brightness, 0-100 (%).
#GLASS_BORDER_OPACITY=26
# Drop-shadow strength, 0-100 (0 = none). Needs SwayFX.
#GLASS_SHADOW=35
# Corner radius in px, 0-40 (CSS everywhere; compositor rounding on SwayFX).
#GLASS_RADIUS=12
# Blur radius 0-10 and passes 1-6 (SwayFX). Cost grows with both.
#GLASS_BLUR_RADIUS=5
#GLASS_BLUR_PASSES=2
# Blur colour: saturation/brightness/contrast in percent, noise 0-30 (SwayFX).
#GLASS_SATURATION=115
#GLASS_BLUR_BRIGHTNESS=95
#GLASS_BLUR_CONTRAST=95
#GLASS_BLUR_NOISE=2
# Dim unfocused windows, 0-50 (%) (SwayFX).
#GLASS_DIM_INACTIVE=0
# Transition length in ms for hover effects; 0 = none.
#GLASS_ANIM_MS=120
# Gap between windows / floating bar margin in px.
#GLASS_GAPS=6
# Window border width in px.
#GLASS_BORDER_WIDTH=1

# --- Layer-shell namespaces (advanced) ---------------------------------------
# SwayFX applies blur/rounding to bars, launchers and notifications by their
# layer-shell namespace. LuxenOS uses the namespaces of the programs it ships
# (waybar -> "waybar", wofi -> "wofi", dunst -> "notifications") but only for
# programs that are installed. If you replace one of them, list the new
# program's namespace(s), space separated. Check what a program uses with:
#   WAYLAND_DEBUG=client <program> 2>&1 | grep get_layer_surface
#GLASS_NS_BAR=waybar
#GLASS_NS_LAUNCHER=wofi
#GLASS_NS_NOTIFY=notifications
