# LuxenOS Updater Configuration File
# 
# Controls automatic update behavior, backup retention, and notification settings.

# ============================================================================
# Automatic Update Settings
# ============================================================================

# Enable automatic updates (yes/no)
ENABLE_AUTO_UPDATES=no

# Time to run automatic updates (24-hour format, HH:MM)
AUTO_UPDATE_TIME=02:00

# Only run updates on AC power (yes/no)
# If yes, updates will not run on battery to save energy
UPDATES_ON_AC_ONLY=yes

# Download updates immediately, install on next boot (yes/no)
# Useful to prevent interruptions during the day
DOWNLOAD_ONLY=no

# ============================================================================
# Update Components
# ============================================================================

# Update system packages (yes/no)
UPDATE_PACKAGES=yes

# Update Waydroid and Android components (yes/no)
UPDATE_WAYDROID=yes

# Update Flatpak applications (yes/no)
UPDATE_FLATPAKS=yes

# Update system firmware (yes/no, may require reboot)
UPDATE_FIRMWARE=yes

# Install security updates automatically (yes/no)
# These will be installed even if AUTO_UPDATES is disabled
AUTO_INSTALL_SECURITY=yes

# ============================================================================
# Backup Settings
# ============================================================================

# Number of backups to keep (older backups are automatically deleted)
BACKUP_RETENTION=5

# Create backup before updates (yes/no)
CREATE_BACKUP_BEFORE_UPDATE=yes

# Backup location (must have at least 5GB free space)
BACKUP_DIRECTORY=/var/backups/luxenos

# ============================================================================
# Notification Settings
# ============================================================================

# Send desktop notifications for update status (yes/no)
ENABLE_NOTIFICATIONS=yes

# Notify when updates are available (yes/no)
NOTIFY_AVAILABLE=yes

# Notify when updates complete (yes/no)
NOTIFY_COMPLETE=yes

# ============================================================================
# Update Logs
# ============================================================================

# Log file location
LOG_FILE=/var/log/luxenos-updates.log

# Keep logs for N days (auto-cleanup)
LOG_RETENTION_DAYS=90

# ============================================================================
# Reboot Behavior
# ============================================================================

# Allow automatic reboot after updates (yes/no)
ALLOW_AUTO_REBOOT=no

# Days without user activity before allowing auto reboot
# Set to 0 to reboot immediately after updates
AUTO_REBOOT_GRACE_PERIOD_DAYS=7

# ============================================================================
# Advanced Settings
# ============================================================================

# Maximum parallel downloads
MAX_PARALLEL_DOWNLOADS=3

# Network timeout for package downloads (seconds)
NETWORK_TIMEOUT=30

# Retry failed downloads N times
RETRY_FAILED_DOWNLOADS=3

# Check for connection before updating (yes/no)
CHECK_CONNECTION=yes

# Proxy configuration (leave empty for no proxy)
# PROXY_URL=http://proxy.example.com:8080
PROXY_URL=

# ============================================================================
# Expert Settings (do not modify unless you know what you're doing)
# ============================================================================

# Enable verbose logging (yes/no)
VERBOSE_LOGGING=no

# Allow experimental updates (yes/no)
EXPERIMENTAL_UPDATES=no

# ============================================================================
# Per-User Settings
# ============================================================================

# Notify specific users of updates (comma-separated usernames)
# Leave empty to notify all users
NOTIFY_USERS=

# Allow user to decline updates (requires manual action to proceed)
ALLOW_USER_DECLINE=yes

# Days to wait after user declines before prompting again
DECLINE_GRACE_PERIOD_DAYS=7
