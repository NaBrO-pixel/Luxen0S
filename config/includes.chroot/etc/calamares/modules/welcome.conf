---
# LuxenOS override of calamares-settings-debian's welcome.conf. Debian's copy
# requires 15 GiB of disk, which refused every smaller disk and USB target
# although LuxenOS installs in far less.
#
# requiredStorage (GiB) covers: the installed system (~4 GiB), the Waydroid
# Android image that waydroid-first-init.service downloads and unpacks on
# first boot (~3 GiB, GAPPS), and room for updates and a home directory.
# When you change it, check the size report of a "Build LuxenOS ISO" run
# ("chroot total") first. The release notes quote these numbers
# (.github/workflows/draft-release.yml reads them from this file).
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    10
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
