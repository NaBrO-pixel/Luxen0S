---
# Runs as the last "exec" step on the freshly-installed target (see
# sequence in /etc/calamares/settings.conf). Strips the installer-only kiosk
# session so the installed system boots into the normal full desktop
# defined in /etc/skel/.config/sway/config instead of straight into
# Calamares again.
removeSourceOnDone: false
files:
    - path: /etc/luxenos-installer
      recursive: true
    - path: /etc/systemd/system/getty@tty1.service.d/luxenos-autologin.conf
      recursive: false
    - path: /etc/systemd/system/getty@tty1.service.d
      recursive: false
    - path: /root/.bash_profile.luxenos-kiosk
      recursive: false
