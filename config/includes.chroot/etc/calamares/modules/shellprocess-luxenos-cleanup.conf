---
# Runs inside the freshly installed target (see "shellprocess@luxenos-cleanup"
# in /etc/calamares/settings.conf). It turns the copied live image into a
# normal installed system:
#   * removes the live-boot/live-config packages so the installed initramfs
#     does not try to boot as a live system, then rebuilds the initramfs;
#   * removes the installer-only kiosk files.
# Every step tolerates "already gone" so the job cannot fail an otherwise
# good installation.
dontChroot: false
timeout: 600
script:
    - command: "DEBIAN_FRONTEND=noninteractive apt-get -y purge live-boot live-boot-initramfs-tools live-config live-config-systemd live-tools || true"
      timeout: 300
    - command: "rm -rf /etc/luxenos-installer /etc/systemd/system/getty@tty1.service.d/luxenos-autologin.conf"
    - command: "rmdir --ignore-fail-on-non-empty /etc/systemd/system/getty@tty1.service.d || true"
    - command: "update-initramfs -u -k all || true"
      timeout: 300
