---
# Runs inside the freshly installed target (see "shellprocess@luxenos-cleanup"
# in /etc/calamares/settings.conf). It turns the copied live image into a
# normal installed system:
#   * removes the live-boot/live-config packages so the installed initramfs
#     does not try to boot as a live system, then rebuilds the initramfs;
#   * removes the installer-only kiosk files and the live-only root access
#     for the installer (luxenos-live-access: service, its enablement link,
#     the script, and -- defensively, they live only in the live RAM overlay
#     and unpackfs never copies them -- the sudoers/polkit files it writes and
#     live-config's own);
#   * drops the build's "never install Recommends" apt setting (auto/config
#     builds with --apt-recommends false, and live-build leaves that setting
#     in the image), so apt on the installed system behaves like Debian's;
#   * on BIOS installs, records the disk GRUB was installed to in debconf
#     (grub-pc/install_devices), the way Debian's installer does. Without it
#     every later grub-pc upgrade stops with "You must correct your GRUB
#     install devices" (fatal under unattended-upgrades). UEFI installs keep
#     grub-pc only for its files; its postinst skips them (no i386-pc core.img).
# Every step tolerates "already gone" so the job cannot fail an otherwise
# good installation.
dontChroot: false
timeout: 600
script:
    - command: "DEBIAN_FRONTEND=noninteractive apt-get -y purge live-boot live-boot-initramfs-tools live-config live-config-systemd live-tools || true"
      timeout: 300
    - command: "rm -rf /etc/luxenos-installer /etc/systemd/system/getty@tty1.service.d/luxenos-autologin.conf"
    - command: "rmdir --ignore-fail-on-non-empty /etc/systemd/system/getty@tty1.service.d || true"
    - command: "rm -f /etc/systemd/system/luxenos-live-access.service /etc/systemd/system/multi-user.target.wants/luxenos-live-access.service /usr/libexec/luxenos/luxenos-live-access /etc/sudoers.d/luxenos-live-installer /etc/polkit-1/rules.d/49-luxenos-live-installer.rules /etc/sudoers.d/live /usr/share/polkit-1/rules.d/sudo_on_live.rules"
    - command: "rm -f /etc/apt/apt.conf.d/00recommends"
    - command: "if [ ! -d /sys/firmware/efi ] && command -v grub-probe >/dev/null; then disk=$(grub-probe -t disk /boot/grub 2>/dev/null); dev=$disk; for l in /dev/disk/by-id/*; do case $l in */wwn-*|*-part*) continue;; esac; [ \"$(readlink -f \"$l\")\" = \"$disk\" ] && dev=$l && break; done; [ -n \"$dev\" ] && echo \"grub-pc grub-pc/install_devices multiselect $dev\" | debconf-set-selections; fi; true"
    - command: "update-initramfs -u -k all || true"
      timeout: 300
