---
# Runs inside the freshly installed target (see "shellprocess@luxenos-cleanup"
# in /etc/calamares/settings.conf). It turns the copied live image into a
# normal installed system: purges live-boot/live-config, removes the kiosk
# files and the live-only installer root access (luxenos-live-access),
# restores apt's Recommends default, records the BIOS GRUB install disk in
# debconf, and rebuilds the initramfs.
# The steps live in /usr/libexec/luxenos/luxenos-finish-install, which the
# traditional (Debian installer) image runs too, so both installers produce
# the same system. The script tolerates "already gone" and always exits 0 on a
# good installation, so this job cannot fail one.
dontChroot: false
timeout: 900
script:
    - command: "/usr/libexec/luxenos/luxenos-finish-install"
      timeout: 900
