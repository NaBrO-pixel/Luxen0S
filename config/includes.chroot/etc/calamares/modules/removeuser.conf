# Remove the live session's account from the installed system. The person
# doing the installation creates their own account on the "users" page.
# This is also THE definition of the live username: auto/config passes it to
# live-config (username=...) and the installer-kiosk hook autologins it on
# tty1. Change it here only; keep it lowercase letters, digits, '_' or '-'.
username: user
