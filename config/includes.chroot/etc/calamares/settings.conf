---
# LuxenOS Calamares settings. Minimal, standard Debian-live-friendly sequence.
# Individual module configs (welcome.conf, partition.conf, users.conf, etc.)
# should be added under /etc/calamares/modules/ as the installer is tuned;
# calamares-settings-debian provides sane defaults for those in the meantime.

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       luxenos
  module:   welcome
  config:   welcome.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - removefiles
  - umount
- show:
  - finished

branding: luxenos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
