---
# LuxenOS Calamares settings. Installs the live image (unpackfs) onto disk and
# converts it into a normal installed system (removeuser + shellprocess
# cleanup). The installed system logs in through greetd (enabled by
# /usr/libexec/luxenos/enable-greetd.sh, run from the cleanup job), so the
# Calamares "displaymanager" job is intentionally absent.
# Individual module configs (welcome.conf, partition.conf, users.conf, etc.)
# are provided by calamares-settings-debian unless overridden in
# /etc/calamares/modules/.

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       luxenos-cleanup
  module:   shellprocess
  config:   shellprocess-luxenos-cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - removeuser
  - shellprocess@luxenos-cleanup
  - umount
- show:
  - finished

branding: luxenos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
