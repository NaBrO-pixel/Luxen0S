# greetd config: run sway-greeter as the greeter and allow a sway session.
# This file is installed into the target system (not used by the live installer).
# The greeter provides a normal graphical login screen on Wayland.

[daemon]
log = "/var/log/greetd.log"

[default]
timeout = 0  # do not auto-login

[greeter]
command = ["/usr/bin/sway-greeter"]

[[session]]
name = "sway"
command = ["/usr/bin/sway"]
