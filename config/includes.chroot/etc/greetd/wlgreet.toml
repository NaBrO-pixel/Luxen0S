# LuxenOS login screen fallback colours. luxenos-greeter normally generates
# this from /etc/luxenos/glass.conf at every start; this copy (the default
# dark palette) is only used if that fails. Regenerate with:
#   luxenos-glass greeter-config > /etc/greetd/wlgreet.toml
command = "/usr/local/bin/luxenos-sway-session"
outputMode = "all"
scale = 1

[background]
red = 0.078
green = 0.102
blue = 0.149
opacity = 0.82

[headline]
red = 0.910
green = 0.929
blue = 0.969
opacity = 1.00

[prompt]
red = 0.478
green = 0.635
blue = 1.000
opacity = 1.00

[promptErr]
red = 1.000
green = 0.420
blue = 0.384
opacity = 1.00

[border]
red = 0.478
green = 0.635
blue = 1.000
opacity = 0.85
