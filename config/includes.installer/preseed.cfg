# LuxenOS: Debian installer preseed for the traditional (non-live) image.
#
# live-build copies config/includes.installer/ into the Debian installer's
# initrd (only when the image carries the installer, i.e. VARIANT=traditional),
# and d-i reads /preseed.cfg from its initrd automatically: no boot parameter.
#
# This is NOT an unattended install. Language, keyboard, network, disk
# partitioning (including encrypted LVM), the user account and the hostname
# are all still asked. It only answers the questions where LuxenOS differs
# from stock Debian. The root filesystem copied to disk is the LuxenOS
# squashfs on the ISO (d-i's live-installer), not packages from the network.

# Archive areas auto/config builds with (main contrib non-free
# non-free-firmware), so the installed system can update the same packages.
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
# Without this, the installed system keeps a "deb cdrom:" source and apt asks
# for the USB stick on every update.
d-i apt-setup/disable-cdrom-entries boolean true

# The LuxenOS desktop is already in the copied root filesystem. Running tasksel
# would offer (and by default select) Debian's GNOME desktop on top of it.
d-i pkgsel/run_tasksel boolean false
tasksel tasksel/first multiselect
popularity-contest popularity-contest/participate boolean false

# No root password: the first user gets sudo (Debian's polkit admin group), as
# on a Calamares install. LuxenOS's graphical .deb installer and updater
# authenticate that user through polkit.
d-i passwd/root-login boolean false

# Same post-install conversion Calamares runs: purge live-boot/live-config,
# remove the installer kiosk files, restore apt's Recommends default, rebuild
# the initramfs (see /usr/libexec/luxenos/luxenos-finish-install), then enable
# the greetd login screen, as Calamares' final shellprocess step does.
d-i preseed/late_command string in-target /usr/libexec/luxenos/luxenos-finish-install; in-target /usr/libexec/luxenos/enable-greetd.sh
